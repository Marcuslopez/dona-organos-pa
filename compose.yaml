name: dona-organos-pa

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dona_organos_pa}
      MYSQL_USER: ${DB_USERNAME:-dona_organos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dona_organos_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dona_organos_root_local}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-dona_organos_root_local}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
